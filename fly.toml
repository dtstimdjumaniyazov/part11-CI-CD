# fly.toml app configuration file generated for fs-pokedex-dappled-driftwood-9118 on 2026-08-21T15:26:48+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fs-pokedex-dappled-driftwood-9118'
primary_region = 'fra'

[build]

[env]
  PORT="5001"

[processes]
  app = "node app.js"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[deploy]
  strategy = "canary"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
